<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}FlyWire Analysis{% endblock %}</title>
  <style>
    /* ── Reset & base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #21262d;
      --border:      #30363d;
      --text:        #e6edf3;
      --text-muted:  #8b949e;
      --accent:      #58a6ff;
      --accent2:     #3fb950;
      --warn:        #d29922;
      --danger:      #f85149;
      --radius:      8px;
      --font:        'Inter', 'Segoe UI', system-ui, sans-serif;
      --mono:        'JetBrains Mono', 'Fira Code', monospace;
    }

    html { font-size: 15px; scroll-behavior: smooth; }

    body {
      font-family: var(--font);
      background:  var(--bg);
      color:       var(--text);
      min-height:  100vh;
      display:     flex;
      flex-direction: column;
    }

    /* ── Top nav ──────────────────────────────────────── */
    nav.topnav {
      background:    var(--surface);
      border-bottom: 1px solid var(--border);
      padding:       0 1.5rem;
      height:        52px;
      display:       flex;
      align-items:   center;
      gap:           1rem;
      position:      sticky;
      top:           0;
      z-index:       100;
    }

    nav.topnav .brand {
      font-weight: 700;
      font-size:   1.05rem;
      color:       var(--accent);
      text-decoration: none;
      white-space: nowrap;
    }

    nav.topnav .breadcrumb {
      display:   flex;
      gap:       0.4rem;
      align-items: center;
      font-size: 0.82rem;
      color:     var(--text-muted);
      flex-wrap: wrap;
    }

    nav.topnav .breadcrumb a { color: var(--accent); text-decoration: none; }
    nav.topnav .breadcrumb a:hover { text-decoration: underline; }
    nav.topnav .breadcrumb span.sep { color: var(--border); }

    /* ── Page wrapper ─────────────────────────────────── */
    .page-wrapper {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ── Page header ──────────────────────────────────── */
    .page-header {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .page-header h1 {
      font-size:   1.8rem;
      font-weight: 700;
      color:       var(--text);
      line-height: 1.25;
    }

    .page-header .subtitle {
      margin-top: 0.4rem;
      color:      var(--text-muted);
      font-size:  0.9rem;
    }

    /* ── Cards ────────────────────────────────────────── */
    .card {
      background:    var(--surface);
      border:        1px solid var(--border);
      border-radius: var(--radius);
      padding:       1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }

    .card h2 {
      font-size:     1rem;
      font-weight:   600;
      margin-bottom: 0.75rem;
      color:         var(--accent);
      letter-spacing: 0.02em;
    }

    /* ── Tables ───────────────────────────────────────── */
    table.data-table {
      width:           100%;
      border-collapse: collapse;
      font-size:       0.84rem;
      font-family:     var(--mono);
    }

    table.data-table thead tr {
      background:    var(--surface2);
      border-bottom: 2px solid var(--border);
    }

    table.data-table th {
      text-align: left;
      padding:    0.55rem 0.75rem;
      color:      var(--text-muted);
      font-weight: 600;
      font-size:  0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    table.data-table td {
      padding:       0.45rem 0.75rem;
      border-bottom: 1px solid var(--border);
      color:         var(--text);
    }

    table.data-table tr:hover td { background: var(--surface2); }
    table.data-table tr:last-child td { border-bottom: none; }

    /* ── Preservation bar ────────────────────────────── */
    .preservation-bar-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .preservation-bar-bg {
      flex: 1;
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
    }
    .preservation-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s ease;
      background: var(--accent, #3fb950);
    }
    .preservation-bar-fill.green { background: #3fb950; }
    .preservation-bar-fill.yellow { background: #d29922; }
    .preservation-bar-fill.orange { background: #f0883e; }
    .preservation-bar-fill.red   { background: #f85149; }
    .preservation-bar-fill.dark-green  { background: #2ea043; }
    .preservation-bar-fill.light-green { background: #56d364; }

    /* ── Plot gallery ─────────────────────────────────── */
    .plot-gallery {
      display:               grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap:                   1rem;
      margin-top:            0.75rem;
    }

    .plot-card {
      background:    var(--surface2);
      border:        1px solid var(--border);
      border-radius: var(--radius);
      overflow:      hidden;
      transition:    border-color 0.2s;
    }

    .plot-card:hover { border-color: var(--accent); }

    .plot-card img {
      width:   100%;
      height:  220px;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .plot-card .plot-label {
      padding:   0.5rem 0.75rem;
      font-size: 0.78rem;
      color:     var(--text-muted);
    }

    /* ── Grid layouts ─────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

    @media (max-width: 900px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* ── Stat boxes ───────────────────────────────────── */
    .stat-box {
      background:    var(--surface2);
      border:        1px solid var(--border);
      border-radius: var(--radius);
      padding:       1rem 1.25rem;
      text-align:    center;
    }

    .stat-box .stat-value {
      font-size:   1.6rem;
      font-weight: 700;
      color:       var(--accent);
      font-family: var(--mono);
    }

    .stat-box .stat-label {
      margin-top: 0.25rem;
      font-size:  0.78rem;
      color:      var(--text-muted);
    }

    /* ── Link lists ───────────────────────────────────── */
    .link-list {
      list-style: none;
      display:    flex;
      flex-direction: column;
      gap:        0.4rem;
    }

    .link-list li a {
      display:        flex;
      align-items:    center;
      gap:            0.5rem;
      padding:        0.5rem 0.75rem;
      border-radius:  var(--radius);
      color:          var(--accent);
      text-decoration: none;
      font-size:      0.88rem;
      background:     var(--surface2);
      border:         1px solid var(--border);
      transition:     background 0.15s, border-color 0.15s;
    }

    .link-list li a:hover {
      background:    var(--surface);
      border-color:  var(--accent);
    }

    /* ── Footer ───────────────────────────────────────── */
    footer {
      border-top:  1px solid var(--border);
      padding:     1rem 1.5rem;
      text-align:  center;
      font-size:   0.78rem;
      color:       var(--text-muted);
    }

    /* ── Utility ──────────────────────────────────────── */
    .text-muted { color: var(--text-muted); }
    .mono       { font-family: var(--mono); }
    .mt-1       { margin-top: 0.5rem; }
    .mt-2       { margin-top: 1rem; }
    .mb-2       { margin-bottom: 1rem; }
    .positive   { color: var(--danger); }
    .negative   { color: var(--accent2); }
    .tag {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.45rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── Tooltip (CSS-only, driven by data-tip) ───────── */
    .tip {
      position: relative;
      cursor: help;
      border-bottom: 1px dotted var(--text-muted);
    }
    .tip::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 135%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 400;
      font-family: var(--font);
      white-space: normal;
      width: 250px;
      max-width: 70vw;
      text-align: center;
      text-transform: none;
      letter-spacing: normal;
      line-height: 1.45;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 20;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }
    .tip:hover::after { opacity: 1; }

    /* ── Callout / interpretation note ────────────────── */
    .callout {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);
      padding: 0.8rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-muted);
    }
    .callout strong { color: var(--text); }

    /* ── Stat-box sub-labels ──────────────────────────── */
    .stat-box .stat-metric-name {
      margin-top: 0.15rem;
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text);
      font-family: var(--mono);
      word-break: break-word;
    }
    .stat-box .stat-sub {
      margin-top: 0.15rem;
      font-size: 0.78rem;
      color: var(--accent);
      font-family: var(--mono);
    }

    /* ── Scientific-report sections ───────────────────── */
    .report-section {
      margin-bottom: 2.5rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .section-no {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.7rem;
      height: 1.7rem;
      padding: 0 0.35rem;
      background: var(--accent);
      color: #0d1117;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .section-intro {
      color: var(--text-muted);
      font-size: 0.88rem;
      margin-bottom: 1rem;
    }

    .sub-heading {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
      margin: 1rem 0 0.5rem;
    }

    .interpretation-text {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* ── Table of contents ────────────────────────────── */
    .card.toc { background: var(--surface2); }
    .toc-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.5rem;
      font-size: 0.88rem;
    }
    .toc-list a {
      color: var(--accent);
      text-decoration: none;
    }
    .toc-list a:hover { text-decoration: underline; }

    /* ── Executive summary ────────────────────────────── */
    .exec-card { border-color: var(--accent2); }
    .exec-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 800px) { .exec-grid { grid-template-columns: 1fr; } }

    .exec-score {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-align: center;
    }
    .exec-label {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .exec-value {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--accent2);
      font-family: var(--mono);
      margin: 0.4rem 0;
    }

    .findings-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin: 0.5rem 0 0.75rem;
    }
    .findings-list li {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
    }
    .finding-dot { color: var(--accent2); margin-right: 0.35rem; }

    .exec-interpretation {
      background: var(--surface2);
      border-left: 3px solid var(--accent2);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }
    .exec-interpretation strong { color: var(--text); }

    /* ── Comparison page ──────────────────────────────── */
    .comparison-table td, .comparison-table th {
      font-size: 0.82rem;
      vertical-align: top;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="topnav">
  <a class="brand" href="{{ root_path }}index.html">🧠 FlyWire</a>
  <div class="breadcrumb">
    {% block breadcrumb %}{% endblock %}
  </div>
</nav>

<div class="page-wrapper">
  {% block content %}{% endblock %}
</div>

<footer>
  Generated by the FlyWire Scientific Reporting Pipeline &mdash;
  {{ generated_at }}
</footer>

</body>
</html>
